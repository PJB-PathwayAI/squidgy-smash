<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Squidgy Smash</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05090c;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;}
  #col{display:flex;flex-direction:column;align-items:center;gap:10px;}
  #stage{position:relative;line-height:0;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
  #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0.18) 0px,rgba(0,0,0,0.18) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 3px);}
  #vig{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 90px 18px rgba(0,0,0,0.75);}
  .slot{box-sizing:border-box;border:1px dashed rgba(124,112,218,0.55);
    background:rgba(53,40,121,0.16);border-radius:3px;
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 10px;
    font-family:"Courier New",Courier,monospace;font-weight:700;letter-spacing:.10em;
    font-size:clamp(8px,1.7vw,11px);line-height:1.25;text-align:center;padding:0 10px;}
  .slot .tag{color:#7c70da;}
  .slot .ph{color:#cfd8e0;}
  .slot .dim{color:#5d6a76;font-weight:400;letter-spacing:.04em;}
</style>
</head>
<body>
<div id="wrap">
  <div id="col">
    <div class="slot" id="slotTop">
      <span class="tag">PRESENTING PARTNER</span>
      <span class="ph">YOUR LOGO HERE</span>
      <span class="dim">728 &times; 90 &middot; banner</span>
    </div>
    <div id="stage"><canvas id="screen"></canvas><div id="scan"></div><div id="vig"></div></div>
    <div class="slot" id="slotBottom">
      <span class="tag">SUPPORTING PARTNER</span>
      <span class="ph">YOUR LOGO HERE</span>
      <span class="dim">728 &times; 90 &middot; banner</span>
    </div>
  </div>
</div>

'use strict';

/* ================================================================ setup */
var W=320,H=240;
var screenEl=document.getElementById('screen');
var slotTop=document.getElementById('slotTop');
var slotBottom=document.getElementById('slotBottom');
var sctx=screenEl.getContext('2d');
var buf=document.createElement('canvas'); buf.width=W; buf.height=H;
var g=buf.getContext('2d');
g.imageSmoothingEnabled=false;

function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,3);
  var vw=window.innerWidth, vh=window.innerHeight;
  var gap=10, pad=20;
  var slotH=Math.max(34, Math.min(76, Math.round(vw*0.115)));
  var showSlots = vh > 430;
  slotTop.style.display = showSlots?'flex':'none';
  slotBottom.style.display = showSlots?'flex':'none';
  var reserved = showSlots ? (slotH*2 + gap*2) : 0;
  var availH = vh - reserved - pad;
  var sc = Math.min(vw/W, availH/H);
  if(!(sc>0.15)) sc=0.15;
  var cw=Math.floor(W*sc), ch=Math.floor(H*sc);
  screenEl.style.width=cw+'px'; screenEl.style.height=ch+'px';
  screenEl.width=Math.floor(cw*dpr); screenEl.height=Math.floor(ch*dpr);
  sctx.imageSmoothingEnabled=false;
  var stage=document.getElementById('stage');
  stage.style.width=cw+'px'; stage.style.height=ch+'px';
  if(showSlots){
    slotTop.style.width=cw+'px'; slotTop.style.height=slotH+'px';
    slotBottom.style.width=cw+'px'; slotBottom.style.height=slotH+'px';
  }
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120);});

/* ================================================================ palette */

  bg:'#0d171d', c64bg:'#352879', c64text:'#7869c4', c64light:'#7c70da',
  white:'#f2f2f2', red:'#c04040', orange:'#d07040', yellow:'#c0a030',
  green:'#509040', blue:'#3030c0', purple:'#7645dc', dim:'#4a5560', ink:'#05090c',
  squid:'#01b7fe', squidDark:'#04141c'
};
var COLCOL={'1':C.red,'2':C.orange,'3':C.yellow,'4':C.green,'5':C.blue,'6':C.purple};

/* ================================================================ sponsors
   CONFIG ONLY. Real logos drop in here later; the game code never changes. */
var SPONSORS=[
  {n:'AURORA SYSTEMS', c:'#4fd1c5'},
  {n:'NORTHGATE',      c:'#e0a13a'},
  {n:'HELIX LABS',     c:'#c86ad8'}
];
var LEVEL_SPONSOR=[0,1,2,0,1];

function hexToRgb(h){
  return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];
}
function shade(h,f){
  var p=hexToRgb(h);
  return 'rgb('+Math.round(p[0]*f)+','+Math.round(p[1]*f)+','+Math.round(p[2]*f)+')';
}
function ramp(h,n){
  var out=[],i,f;
  for(i=0;i<n;i++){ f=1-(i/(n-1))*0.58; out.push(shade(h,f)); }
  return out;
}
var CLASSIC=[C.red,C.orange,C.yellow,C.green,C.blue,C.purple];
function paletteFor(lv){
  if(lv===0) return CLASSIC;
  return ramp(SPONSORS[LEVEL_SPONSOR[lv]%SPONSORS.length].c,6);
}
function sponsorFor(lv){
  return SPONSORS[LEVEL_SPONSOR[lv]%SPONSORS.length];
}

logoImg.onload=function(){ logoOk=true; };
logoImg.src=LOGO_SRC;
var LOGO_W=112, LOGO_H=25;

function drawLogoPlate(cx,y,scale){
  var s=scale||1;
  var lw=Math.round(LOGO_W*s), lh=Math.round(LOGO_H*s);
  var pw=lw+14, ph=lh+10;
  var x=Math.round(cx-pw/2);
  g.fillStyle='#eef2f5'; g.fillRect(x,y,pw,ph);
  g.fillStyle='#b9c6d0'; g.fillRect(x,y,pw,1); g.fillRect(x,y+ph-1,pw,1);
  if(logoOk){
    g.imageSmoothingEnabled=true;
    g.drawImage(logoImg, x+7, y+5, lw, lh);
    g.imageSmoothingEnabled=false;
  } else {
    text('INSIGHTCP',cx,y+ph/2-5,10,'#3154ff','center',1);
  }
}

/* ================================================================ audio */
var actx=null;
function audioUnlock(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
  if(actx && actx.state==='suspended'){ try{ actx.resume(); }catch(e){} }
}
function tone(freq,dur,delay,type,vol){
  if(!actx) return;
  try{
    var t0=actx.currentTime+(delay||0);
    var o=actx.createOscillator(), gn=actx.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,t0);
    gn.gain.setValueAtTime(0.0001,t0);
    gn.gain.exponentialRampToValueAtTime(vol||0.07,t0+0.012);
    gn.gain.exponentialRampToValueAtTime(0.0001,t0+(dur||0.1));
    o.connect(gn); gn.connect(actx.destination);
    o.start(t0); o.stop(t0+(dur||0.1)+0.03);
  }catch(e){}
}

function sfxBrick(){ tone(660,0.035,0,'square',0.045); }

function sfxWarp(){ tone(523,0.07,0); tone(784,0.07,0.08); tone(1046,0.07,0.16); tone(1568,0.22,0.24); }
function sfxPower(){ tone(700,0.06,0); tone(1050,0.10,0.06); }
function sfxSyntax(){ tone(120,0.18,0,'sawtooth',0.06); tone(90,0.28,0.16,'sawtooth',0.06); }

function sfxEntry(){ tone(523,0.09,0); tone(659,0.09,0.09); tone(880,0.22,0.18); }
function sfxLevel(){ tone(587,0.09,0); tone(740,0.09,0.09); tone(880,0.18,0.18); }

/* ================================================================ text */
function text(str,x,y,size,color,align,spacing){
  g.fillStyle=color;
  g.font='bold '+size+'px "Courier New",Courier,monospace';
  g.textBaseline='top';
  var sp=spacing||0, i, ch, total=0, cx;
  if(align==='center'){
    for(i=0;i<str.length;i++){ total+=g.measureText(str.charAt(i)).width+sp; }
    total-=sp; cx=x-total/2;
  } else { cx=x; }
  for(i=0;i<str.length;i++){
    ch=str.charAt(i);
    if(ch!==' '){ g.fillText(ch,cx,y); }
    cx+=g.measureText(ch).width+sp;
  }
}

var squidImgEl=new Image(), squidOk=false;
squidImgEl.onload=function(){ squidOk=true; };
squidImgEl.src=SQUID_SRC;

function squidAspect(){ return squidOk ? (squidImgEl.height/squidImgEl.width) : 0.9236; }

function drawSquid(cx,y,w){
  if(!squidOk) return;
  var h=Math.round(w*squidAspect());
  g.imageSmoothingEnabled=true;
  g.drawImage(squidImgEl, Math.round(cx-w/2), Math.round(y), w, h);
  g.imageSmoothingEnabled=false;
}
function drawSquidReveal(cx,y,w,frac){
  if(!squidOk) return;
  var h=Math.round(w*squidAspect());
  var cols=Math.max(1,Math.round(squidImgEl.width*frac));
  var dw=Math.max(1,Math.round(w*frac));
  g.imageSmoothingEnabled=true;
  g.drawImage(squidImgEl,0,0,cols,squidImgEl.height, Math.round(cx-w/2),Math.round(y),dw,h);
  g.imageSmoothingEnabled=false;
}

/* ================================================================ state */
var state='boot';
var frame=0, loadT=0, titleTaps=0, titleTapT=0, introT=0;
var score=0, lives=3, levelIdx=0, badge='', inSecret=false, returnLevel=0;
var balls=[], bricks=[], drops=[], bgDots=[];
var paddle={x:W/2-28,y:H-18,w:56,h:5,baseW:56};
var wideT=0, slowT=0, flash=0;
var ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
var entry={i:0, chars:['A','A','A']};
var HS=[], lastEntryIdx=-1, hiScore=0;

var COLS=13, ROWS=6, BW=22, BH=9, GAP=2, MX=5, BY=18;

var LEVELS=[
 ["0000000000000","1111111111111","2222222222222","3333333333333","4444444444444","0000000000000"],
 ["1100000000011","1111111111111","0222222222220","0333333333330","0044444444400","0005555555000"],
 ["1111111111111","2222002220022","3333333333333","4440000000044","5555555555555","0006666666000"],
 ["6666666666666","5555000005555","4444444444444","3330000003330","2222222222222","0011111111100"],
 ["1212121212121","2121212121212","5555555555555","6666666666666","0004444444000","0000333330000"]
];
var SECRET=["6161616161616","1616161616161","6161616161616","1616161616161","6161616161616","1616161616161"];

/* ================================================================ scores */
function loadHS(){
  try{ HS=JSON.parse(localStorage.getItem('sq_hs')||'[]'); }catch(e){ HS=[]; }
  if(!Array.isArray(HS)) HS=[];
  HS=HS.filter(function(e){ return e && typeof e.s==='number' && typeof e.i==='string'; });
  HS.sort(function(a,b){ return b.s-a.s; });
  HS=HS.slice(0,8);
  hiScore=HS.length?HS[0].s:0;
}
function saveHS(){
  try{ localStorage.setItem('sq_hs',JSON.stringify(HS)); }catch(e){}
  hiScore=HS.length?HS[0].s:0;
}
function qualifies(s){ return s>0 && (HS.length<8 || s>HS[HS.length-1].s); }
function commitScore(){
  var rec={i:entry.chars.join(''), s:score};
  HS.push(rec);
  HS.sort(function(a,b){ return b.s-a.s; });
  HS=HS.slice(0,8);
  lastEntryIdx=HS.indexOf(rec);
  saveHS();
}
loadHS();

/* ================================================================ level build */
function makeBg(){
  bgDots=[];
  for(var i=0;i<30;i++){
    bgDots.push({x:(i*97+37*levelIdx)%W, y:(i*61+23*levelIdx)%H});
  }
}
function buildLevel(){
  var pat = inSecret ? SECRET : LEVELS[levelIdx];
  var pal = inSecret ? ramp(SPONSORS[2].c,6) : paletteFor(levelIdx);
  bricks=[]; drops=[];
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var ch=pat[r].charAt(c);
      if(ch==='0') continue;
      bricks.push({
        x:MX+c*(BW+GAP), y:BY+r*(BH+GAP), w:BW, h:BH,
        col:pal[r%pal.length], alive:true, warp:false
      });
    }
  }
  if(!inSecret && levelIdx===2){
    var wr=1, wc=7;
    for(var i=0;i<bricks.length;i++){
      var b=bricks[i];
      if(Math.abs(b.y-(BY+wr*(BH+GAP)))<1 && Math.abs(b.x-(MX+wc*(BW+GAP)))<1){
        b.warp=true; b.col=pal[1];
      }
    }
  }
  makeBg();
  resetBall();
  wideT=0; slowT=0; paddle.w=paddle.baseW;
  introT=95;
}
function ballSpeed(){
  var base=2.55+levelIdx*0.14;
  if(inSecret) base=2.9;
  if(slowT>0) base*=0.68;
  return Math.min(4.3,base);
}
function resetBall(){
  balls=[{x:paddle.x+paddle.w/2-3, y:paddle.y-14, vx:0, vy:0, s:6, live:true, held:true}];
}
function launch(){
  var sp=ballSpeed();
  for(var i=0;i<balls.length;i++){
    if(balls[i].held){
      balls[i].held=false;
      balls[i].vx=sp*0.42;
      balls[i].vy=-sp;
    }
  }
}

/* ================================================================ input */
function paddleTo(cx){
  var r=screenEl.getBoundingClientRect();
  paddle.x=(cx-r.left)/r.width*W-paddle.w/2;
  clampPaddle();
}
function clampPaddle(){
  if(paddle.x<2) paddle.x=2;
  if(paddle.x+paddle.w>W-2) paddle.x=W-2-paddle.w;
}
function cycleChar(idx){
  var cur=ALPHA.indexOf(entry.chars[idx]);
  if(cur<0) cur=0;
  entry.chars[idx]=ALPHA.charAt((cur+1)%ALPHA.length);
  sfxType();
}

document.addEventListener('pointerdown',function(e){
  audioUnlock();
  var r=screenEl.getBoundingClientRect();
  var lx=(e.clientX-r.left)/r.width*W;
  var ly=(e.clientY-r.top)/r.height*H;

  if(state==='boot'){ state='loading'; loadT=0; sfxThree(); return; }
  if(state==='loading'){ return; }

  if(state==='title'){
    var onMascot=(lx>W/2-58 && lx<W/2+58 && ly>0 && ly<68);
    if(onMascot){
      titleTaps++; titleTapT=60;
      if(titleTaps>=3){ state='syntax'; titleTaps=0; sfxSyntax(); }
      return;
    }
    titleTaps=0;
    startGame(); return;
  }
  if(state==='play'){
    if(introT>0){ introT=0; return; }
    paddleTo(e.clientX); launch(); return;
  }
  if(state==='entry'){
    var i, bx=101, by=98, bwid=34, bhi=46, gap=8;
    for(i=0;i<3;i++){
      if(lx>bx+i*(bwid+gap) && lx<bx+i*(bwid+gap)+bwid && ly>by && ly<by+bhi){
        entry.i=i; cycleChar(i); return;
      }
    }
    if(lx>105 && lx<215 && ly>170 && ly<198){
      commitScore(); sfxEntry(); state='table'; return;
    }
    return;
  }
  if(state==='table'){ state='title'; return; }
  if(state==='syntax'){ state='title'; titleTaps=0; return; }
  if(state==='over'||state==='win'){
    if(qualifies(score)){ entry.i=0; entry.chars=['A','A','A']; state='entry'; }
    else { state='table'; }
    return;
  }
}, {passive:true});

document.addEventListener('pointermove',function(e){
  if(state==='play' && introT<=0){ paddleTo(e.clientX); }
},{passive:true});

window.addEventListener('keydown',function(e){
  audioUnlock();
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'){ paddle.x-=14; clampPaddle(); }
  if(k==='ArrowRight'||k==='d'){ paddle.x+=14; clampPaddle(); }
  if(state==='entry'){
    if(k==='ArrowRight'){ entry.i=Math.min(2,entry.i+1); }
    if(k==='ArrowLeft'){ entry.i=Math.max(0,entry.i-1); }
    if(k==='ArrowUp'){ cycleChar(entry.i); }
    if(k==='ArrowDown'){
      var cur=ALPHA.indexOf(entry.chars[entry.i]);
      entry.chars[entry.i]=ALPHA.charAt((cur-1+ALPHA.length)%ALPHA.length);
      sfxType();
    }
    if(k==='Enter'){ commitScore(); sfxEntry(); state='table'; }
    return;
  }
  if(k===' '||k==='Enter'){
    if(state==='boot'){ state='loading'; loadT=0; sfxThree(); }
    else if(state==='title'){ startGame(); }
    else if(state==='play'){ if(introT>0){ introT=0; } else { launch(); } }
    else if(state==='over'||state==='win'){
      if(qualifies(score)){ entry.i=0; entry.chars=['A','A','A']; state='entry'; } else { state='table'; }
    }
    else if(state==='table'||state==='syntax'){ state='title'; }
  }
});

function startGame(){
  score=0; lives=3; levelIdx=0; badge=''; inSecret=false;
  paddle.w=paddle.baseW;
  buildLevel();
  state='play';
}

/* ================================================================ physics
   UNCHANGED. Same speeds, same levels, same collision. */
function hitBrick(b){
  b.alive=false;
  score+=inSecret?25:10;
  sfxBrick();
  if(b.warp && !inSecret){
    flash=22; sfxWarp();
    inSecret=true; returnLevel=levelIdx+1;
    badge='WARP';
    setTimeout(function(){ if(state==='play'){ buildLevel(); } },260);
    return;
  }
  if(Math.random()<0.13){
    var types=['M','W','S'];
    drops.push({x:b.x+b.w/2-5, y:b.y, w:10, h:10, vy:1.1, type:types[(Math.random()*3)|0]});
  }
}

function step(){
  var i,b;

  if(state==='loading'){ loadT++; if(loadT>150){ state='title'; } }
  if(titleTapT>0){ titleTapT--; if(titleTapT===0) titleTaps=0; }
  if(flash>0) flash--;

  if(state!=='play') return;
  if(introT>0){ introT--; return; }
  if(wideT>0){ wideT--; if(wideT===0){ paddle.w=paddle.baseW; clampPaddle(); } }
  if(slowT>0){ slowT--; }

  for(i=0;i<balls.length;i++){
    b=balls[i];
    if(!b.live) continue;
    if(b.held){ b.x=paddle.x+paddle.w/2-3; b.y=paddle.y-14; continue; }

    b.x+=b.vx; b.y+=b.vy;

    if(b.x<2){ b.x=2; b.vx=Math.abs(b.vx); }
    if(b.x+b.s>W-2){ b.x=W-2-b.s; b.vx=-Math.abs(b.vx); }
    if(b.y<14){ b.y=14; b.vy=Math.abs(b.vy); }

    if(b.vy>0 && b.y+b.s>=paddle.y && b.y+b.s<=paddle.y+paddle.h+8 &&
       b.x+b.s>paddle.x && b.x<paddle.x+paddle.w){
      var rel=(b.x+b.s/2-(paddle.x+paddle.w/2))/(paddle.w/2);
      if(rel<-1) rel=-1; if(rel>1) rel=1;
      var ang=rel*1.05;
      var sp=Math.min(4.35,Math.hypot(b.vx,b.vy)+0.015);
      b.vx=Math.sin(ang)*sp;
      b.vy=-Math.abs(Math.cos(ang)*sp);
      b.y=paddle.y-b.s-0.5;
      sfxPaddle();
    }

    for(var k=0;k<bricks.length;k++){
      var br=bricks[k];
      if(!br.alive) continue;
      if(b.x+b.s>br.x && b.x<br.x+br.w && b.y+b.s>br.y && b.y<br.y+br.h){
        var ox=Math.min(b.x+b.s-br.x, br.x+br.w-b.x);
        var oy=Math.min(b.y+b.s-br.y, br.y+br.h-b.y);
        if(ox<oy){
          b.vx=-b.vx;
          b.x+=(b.x+b.s/2 < br.x+br.w/2) ? -ox : ox;
        } else {
          b.vy=-b.vy;
          b.y+=(b.y+b.s/2 < br.y+br.h/2) ? -oy : oy;
        }
        hitBrick(br);
        break;
      }
    }
    if(b.y>H+10){ b.live=false; }
  }

  balls=balls.filter(function(x){ return x.live; });
  if(balls.length===0 && state==='play'){ loseBall(); }

  for(i=drops.length-1;i>=0;i--){
    var d=drops[i];
    d.y+=d.vy;
    if(d.y>H+10){ drops.splice(i,1); continue; }
    if(d.y+d.h>paddle.y && d.y<paddle.y+paddle.h+6 && d.x+d.w>paddle.x && d.x<paddle.x+paddle.w){
      sfxPower();
      if(d.type==='M'){
        var src=balls[0];
        if(src){
          var sp2=Math.hypot(src.vx,src.vy)||ballSpeed();
          balls.push({x:src.x,y:src.y,vx:sp2*0.7,vy:-sp2*0.8,s:6,live:true,held:false});
          balls.push({x:src.x,y:src.y,vx:-sp2*0.7,vy:-sp2*0.8,s:6,live:true,held:false});
        }
      }
      if(d.type==='W'){ paddle.w=Math.min(96,paddle.baseW+30); wideT=900; }
      if(d.type==='S'){
        slowT=600;
        for(var m=0;m<balls.length;m++){ balls[m].vx*=0.68; balls[m].vy*=0.68; }
      }
      score+=15;
      drops.splice(i,1);
    }
  }

  var remaining=0;
  for(i=0;i<bricks.length;i++){ if(bricks[i].alive) remaining++; }
  if(remaining===0 && state==='play'){
    if(inSecret){
      inSecret=false; score+=500; levelIdx=returnLevel; badge='WARP';
      buildLevel(); return;
    }
    levelIdx++;
    if(levelIdx>=LEVELS.length){ state='win'; return; }
    sfxLevel();
    buildLevel();
  }
}

function loseBall(){
  if(inSecret){ inSecret=false; levelIdx=returnLevel; buildLevel(); return; }
  lives--;
  sfxLose();
  if(lives<=0){ state='over'; return; }
  resetBall();
}

/* ================================================================ render */
function drawHUD(){
  text('SCORE '+('000000'+score).slice(-6),6,3,9,C.white,'left',0);
  text(inSecret?'SECRET':('LV '+(levelIdx+1)),W/2,3,9,inSecret?C.yellow:C.c64light,'center',0);
  for(var i=0;i<lives;i++){
    g.fillStyle=C.white;
    g.fillRect(W-7-(i+1)*10,4,7,7);
  }
  if(badge) text(badge,W-7-lives*10-52,3,8,C.yellow,'left',0);
}

function drawSponsorPlate(x,y,w,h,sp,label){
  g.fillStyle=C.ink; g.fillRect(x,y,w,h);
  g.strokeStyle=sp.c; g.lineWidth=1;
  g.strokeRect(x+0.5,y+0.5,w-1,h-1);
  text(label,x+w/2,y+6,7,sp.c,'center',1);
  text(sp.n,x+w/2,y+h/2-2,9,C.white,'center',1);
}

function drawBackdrop(){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  var i;
  if(levelIdx===0){
    g.fillStyle='rgba(120,105,196,0.16)';
    for(i=0;i<bgDots.length;i++){ g.fillRect(bgDots[i].x,bgDots[i].y,1,1); }
  } else if(levelIdx===1){
    g.fillStyle='rgba(79,209,197,0.07)';
    for(i=0;i<W;i+=16){ g.fillRect(i,14,1,H-14); }
  } else if(levelIdx===2){
    g.strokeStyle='rgba(224,161,58,0.07)'; g.lineWidth=1;
    for(i=-H;i<W;i+=14){ g.beginPath(); g.moveTo(i,H); g.lineTo(i+H,0); g.stroke(); }
  } else if(levelIdx===3){
    g.fillStyle='rgba(200,106,216,0.10)';
    for(i=0;i<bgDots.length;i++){ g.fillRect(bgDots[i].x,bgDots[i].y,2,2); }
  } else {
    g.fillStyle='rgba(120,105,196,0.07)';
    for(i=16;i<H;i+=10){ g.fillRect(0,i,W,1); }
  }
  if(inSecret){
    g.fillStyle='rgba(118,69,220,0.12)';
    g.fillRect(0,0,W,H);
  }
}

function drawBoot(){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  drawSquid(W/2,10,78);
  text('SQUIDGY SMASH',W/2,94,13,C.white,'center',2);
  text('PATHWAYAI LTD   MMXXVII',W/2,114,7,C.dim,'center',1);
  if((Math.sin(frame/18)+1)/2>0.35) text('TAP TO LOAD',W/2,136,12,C.yellow,'center',2);
  drawLogoPlate(W/2,166,1);
  text('PRESENTED BY',W/2,208,7,C.dim,'center',2);
}

function drawLoading(){
  g.fillStyle=C.c64bg; g.fillRect(0,0,W,H);
  g.strokeStyle=C.c64light; g.lineWidth=6;
  g.strokeRect(3,3,W-6,H-6);

  var prog=loadT/150;
  if(loadT>55&&loadT<78){ prog=55/150; }
  drawSquidReveal(W/2,22,58,prog);

  text('LOADING',W/2,88,11,C.c64text,'center',2);

  var bx=40, by=106, bw=W-80, bh=10;
  g.strokeStyle=C.c64text; g.lineWidth=1; g.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
  var filled=Math.floor(prog*(bw-4));
  for(var x=0;x<filled;x+=4){
    g.fillStyle=((Math.floor(x/4)+Math.floor(frame/6))%3===0)?C.c64light:C.c64text;
    g.fillRect(bx+2+x,by+2,3,bh-4);
  }
  text(('00'+Math.floor(prog*100)).slice(-3)+'%',W/2,122,9,C.c64text,'center',1);

  if(loadT<46 && Math.floor(frame/10)%2===0){
    text('PRESS PLAY ON TAPE',W/2,142,8,C.yellow,'center',1);
  }
  if(prog>=1){ text('READY.',W/2,142,10,C.white,'center',2); }

  var sp=SPONSORS[0];
  text('CAMPAIGN PARTNER',W/2,168,7,C.c64light,'center',1);
  text(sp.n,W/2,180,9,sp.c,'center',1);
  drawLogoPlate(W/2,196,0.6);
}

function drawTitle(){
  drawBackdrop();
  drawSquid(W/2,0,60);
  text('SQUIDGY',W/2,62,21,C.white,'center',3);
  text('SMASH',W/2,86,21,C.yellow,'center',3);
  if((Math.sin(frame/16)+1)/2>0.3) text('TAP TO START',W/2,116,12,C.c64light,'center',2);

  var sp=SPONSORS[Math.floor(frame/240)%SPONSORS.length];
  drawSponsorPlate(56,136,W-112,32,sp,'PRINCIPAL PARTNER');

  drawLogoPlate(W/2,176,0.75);
  text('HI '+('000000'+hiScore).slice(-6),W/2,212,8,C.dim,'center',1);
}

function drawSyntax(){
  g.fillStyle=C.c64bg; g.fillRect(0,0,W,H);
  g.strokeStyle=C.c64light; g.lineWidth=6; g.strokeRect(3,3,W-6,H-6);
  text('?SYNTAX  ERROR',38,70,13,C.c64text,'left',1);
  text('READY.',38,112,11,C.c64text,'left',1);
  if(Math.floor(frame/14)%2===0){ g.fillStyle=C.c64text; g.fillRect(38,134,9,11); }
  text('TAP TO CONTINUE',W/2,198,9,C.dim,'center',1);
}

function drawIntroCard(){
  var sp = inSecret ? SPONSORS[2] : sponsorFor(levelIdx);
  g.fillStyle='rgba(5,9,12,0.86)';
  g.fillRect(0,0,W,H);
  if(inSecret){
    text('SECRET AREA',W/2,84,19,C.purple,'center',3);
    text('YOU FOUND IT',W/2,112,11,C.white,'center',2);
  } else {
    text('LEVEL '+(levelIdx+1),W/2,76,19,C.white,'center',3);
    text('BROUGHT TO YOU BY',W/2,104,8,C.dim,'center',2);
    drawSponsorPlate(48,122,W-96,38,sp,'LEVEL PARTNER');
  }
  if(Math.floor(frame/16)%2===0) text('TAP TO PLAY',W/2,194,9,C.dim,'center',1);
}

function drawPlay(){
  drawBackdrop();
  for(var i=0;i<bricks.length;i++){
    var b=bricks[i];
    if(!b.alive) continue;
    g.fillStyle=b.col;
    g.fillRect(b.x,b.y,b.w,b.h);
    g.fillStyle='rgba(255,255,255,0.22)'; g.fillRect(b.x,b.y,b.w,1);
    g.fillStyle='rgba(0,0,0,0.28)'; g.fillRect(b.x,b.y+b.h-1,b.w,1);
  }
  for(i=0;i<drops.length;i++){
    var d=drops[i];
    g.fillStyle=C.white; g.fillRect(d.x,d.y,d.w,d.h);
    text(d.type,d.x+2,d.y+1,8,C.ink,'left',0);
  }
  g.fillStyle=wideT>0?C.yellow:C.white;
  g.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  g.fillStyle='rgba(255,255,255,0.35)'; g.fillRect(paddle.x,paddle.y,paddle.w,1);

  for(i=0;i<balls.length;i++){
    var bl=balls[i];
    g.fillStyle=C.white;
    g.fillRect(Math.round(bl.x),Math.round(bl.y),bl.s,bl.s);
  }
  drawHUD();

  if(balls.length&&balls[0].held&&Math.floor(frame/20)%2===0&&introT<=0){
    text('TAP TO LAUNCH',W/2,paddle.y-26,9,C.dim,'center',1);
  }
  if(flash>0){
    g.fillStyle='rgba(255,255,255,'+(flash/44)+')';
    g.fillRect(0,0,W,H);
    text('WARP!',W/2,110,19,C.white,'center',3);
  }
  if(introT>0) drawIntroCard();
}

function drawOver(win){
  drawBackdrop();
  text(win?'YOU WIN':'GAME OVER',W/2,28,21,win?C.green:C.red,'center',3);
  text('SCORE',W/2,64,9,C.dim,'center',1);
  text(('000000'+score).slice(-6),W/2,76,23,C.white,'center',3);
  if(badge) text('BADGE '+badge,W/2,106,10,C.yellow,'center',1);
  drawSponsorPlate(56,124,W-112,32,SPONSORS[1],'CORPORATE PARTNER');
  if((Math.sin(frame/16)+1)/2>0.3){
    text(qualifies(score)?'TAP TO ENTER INITIALS':'TAP FOR HIGH SCORES',W/2,168,10,C.c64light,'center',1);
  }
  drawLogoPlate(W/2,194,0.7);
}

function drawEntry(){
  drawBackdrop();
  text('NEW HIGH SCORE',W/2,30,17,C.yellow,'center',2);
  text(('000000'+score).slice(-6),W/2,54,17,C.white,'center',2);
  text('ENTER YOUR INITIALS',W/2,80,8,C.dim,'center',1);

  var bx=101, by=98, bwid=34, bhi=46, gap=8;
  for(var i=0;i<3;i++){
    var x=bx+i*(bwid+gap);
    var sel=(entry.i===i);
    g.fillStyle=C.ink; g.fillRect(x,by,bwid,bhi);
    g.strokeStyle=sel?C.yellow:C.dim; g.lineWidth=sel?2:1;
    g.strokeRect(x+0.5,by+0.5,bwid-1,bhi-1);
    if(!sel || Math.floor(frame/12)%2===0){
      text(entry.chars[i],x+bwid/2,by+13,20,sel?C.yellow:C.white,'center',0);
    }
    g.fillStyle=sel?C.yellow:C.dim;
    g.fillRect(x+bwid/2-4,by+bhi-6,8,2);
  }
  text('TAP A LETTER TO CHANGE IT',W/2,154,8,C.dim,'center',1);

  g.fillStyle=C.ink; g.fillRect(105,170,110,28);
  g.strokeStyle=C.yellow; g.lineWidth=1;
  g.strokeRect(105.5,170.5,109,27);
  text('OK',160,177,13,C.yellow,'center',1);
  text('SCORE SAVED ON THIS DEVICE ONLY',W/2,214,7,C.dim,'center',1);
}

function drawTable(){
  drawBackdrop();
  text('HIGH SCORES',W/2,18,17,C.yellow,'center',2);
  if(!HS.length) text('NO SCORES YET',W/2,104,10,C.dim,'center',1);
  for(var i=0;i<HS.length;i++){
    var y=46+i*18;
    var hot=(i===lastEntryIdx);
    if(hot){
      g.fillStyle='rgba(120,105,196,0.18)';
      g.fillRect(58,y-4,W-116,17);
    }
    text((' '+(i+1)).slice(-2)+'.',68,y,10,hot?C.yellow:C.dim,'left',0);
    text(HS[i].i,110,y,10,hot?C.yellow:C.white,'left',2);
    text(('000000'+HS[i].s).slice(-6),W-68,y,10,hot?C.yellow:C.white,'right',0);
  }
  if((Math.sin(frame/16)+1)/2>0.3) text('TAP TO CONTINUE',W/2,192,8,C.dim,'center',1);
  drawLogoPlate(W/2,206,0.6);
}

/* ================================================================ loop */
var last=0, acc=0, STEP=1000/60;
function frameLoop(ts){
  if(!last) last=ts;
  var dt=ts-last; last=ts;
  if(dt>200) dt=200;
  acc+=dt;
  while(acc>=STEP){ step(); frame++; acc-=STEP; }

  if(state==='boot') drawBoot();
  else if(state==='loading') drawLoading();
  else if(state==='title') drawTitle();
  else if(state==='syntax') drawSyntax();
  else if(state==='play') drawPlay();
  else if(state==='over') drawOver(false);
  else if(state==='win') drawOver(true);
  else if(state==='entry') drawEntry();
  else if(state==='table') drawTable();

  sctx.drawImage(buf,0,0,screenEl.width,screenEl.height);
  requestAnimationFrame(frameLoop);
}

resize();
requestAnimationFrame(frameLoop);
})();
</script>
